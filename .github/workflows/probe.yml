name: Live probe
on: { push: { branches: [claude/live-probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node probe.mjs
