name: Check the site

# Builds and tests piper-djing/ without deploying it. Runs on pull requests into
# the site's branch and on pushes to fix branches, so a change is known to build
# before it is merged (merging is what deploys, through deploy-site.yml).

on:
  pull_request:
    branches: [cursor/tanstack-wedding-site-dd32]
    paths:
      - 'piper-djing/**'
      - '.github/workflows/check-site.yml'
  push:
    branches: ['claude/**']
    paths:
      - 'piper-djing/**'
      - '.github/workflows/check-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: piper-djing/.nvmrc
          cache: npm
          cache-dependency-path: piper-djing/package-lock.json

      - name: Install
        working-directory: piper-djing
        run: npm ci

      - name: Unit tests
        working-directory: piper-djing
        run: node --test $(find src -name '*.test.ts' | sort)

      - name: Build for Cloudflare (no deploy)
        working-directory: piper-djing
        run: npm run build:cloudflare
