name: Live check
on:
  push:
    branches: [claude/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node check.mjs
      - name: Push screenshots
        run: |
          git config user.name shots && git config user.email shots@example.com
          git checkout --orphan claude/live-shots
          git rm -rq --cached . && git add -f shots && git commit -qm shots && git push -qf origin HEAD:claude/live-shots
