name: Live check
on:
  push:
    branches: [claude/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node check.mjs
      - name: Push screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b claude/live-shots
          git config user.name "live-check" && git config user.email "live-check@users.noreply.github.com"
          git add -A && git commit -qm "shots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/live-shots
