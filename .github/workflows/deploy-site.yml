name: Deploy the site

# The site lives in piper-djing/ and publishes to the `piper-djing` Worker on
# Cloudflare. A push that touches the site builds it and deploys it, so work no
# longer waits on someone remembering to run wrangler by hand.
#
# Repository secrets this needs (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts: Edit (the "Edit
#                          Cloudflare Workers" template is right)
#   CLOUDFLARE_ACCOUNT_ID  the account ID, shown in the Workers & Pages sidebar

on:
  push:
    branches: [cursor/tanstack-wedding-site-dd32]
    paths:
      - 'piper-djing/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Never let two deploys of the same Worker overlap.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Cloudflare credentials are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions (token needs Workers Scripts: Edit)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version-file: piper-djing/.nvmrc
          cache: npm
          cache-dependency-path: piper-djing/package-lock.json

      - name: Install
        working-directory: piper-djing
        run: npm ci

      # build:cloudflare sets NITRO_PRESET=cloudflare_module in the repo. Plain
      # `npm run build` emits a Node server that wrangler cannot publish.
      - name: Build
        working-directory: piper-djing
        run: npm run build:cloudflare

      - name: Deploy
        working-directory: piper-djing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # Cloudflare can keep serving an older copy of the home page after a
      # deploy. Clear the cache so every update shows straight away. Needs a
      # token with Zone > Cache Purge: CLOUDFLARE_PURGE_TOKEN if set, otherwise
      # CLOUDFLARE_API_TOKEN. The zone comes from CLOUDFLARE_ZONE_ID, or is
      # looked up by name (that needs Zone > Read too). A missing permission
      # only warns: the site is already deployed by this point.
      - name: Clear the Cloudflare cache
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ZONE_NAME: piperpweddingdj.services
        run: |
          api=https://api.cloudflare.com/client/v4
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty') || true
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "::warning title=Cache not cleared::Add the CLOUDFLARE_ZONE_ID secret (Cloudflare > piperpweddingdj.services > Overview > Zone ID)."
            exit 0
          fi
          result=$(curl -sS -X POST "$api/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')
          if [ "$(echo "$result" | jq -r .success)" = true ]; then
            echo "::notice title=Cache cleared::Cloudflare cache purged for $ZONE_NAME."
          else
            echo "::warning title=Cache not cleared::$(echo "$result" | jq -c '.errors') Give the token Zone > Cache Purge, or add CLOUDFLARE_PURGE_TOKEN."
          fi
