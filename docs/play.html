<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quest of the Thirteen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* One committed visual world: an arcade cabinet in a dark room. The game
     owns the colour on screen, so the frame stays near-black and lets the
     canvas be the only lit thing. Every colour is painted explicitly. */
  :root {
    --void:    #05060c;
    --cabinet: #0b0f1e;
    --bevel:   #1c2440;
    --rule:    #141c34;
    --gold:    #f8d048;
    --ice:     #c8d0e8;
    --dim:     #6f7fa8;
    --violet:  #9a7ad6;
    --cap:     #111a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--ice);
    font-family: "DM Mono", ui-monospace, "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  #cabinet {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 12px;
  }

  /* --- wordmark ----------------------------------------------------------- */
  #plate {
    display: flex; align-items: baseline; gap: 12px;
    font-family: Silkscreen, "DM Mono", monospace;
    line-height: 1;
  }
  #plate .mark {
    font-size: 13px; font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.06em;
  }
  #plate .sub {
    font-family: "DM Mono", monospace;
    font-size: 11px; color: var(--dim);
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* --- the screen --------------------------------------------------------- */
  #stage {
    position: relative;
    line-height: 0;
    outline: none;
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    background: #000;
    border: 2px solid var(--bevel);
    box-shadow: 0 0 0 1px #000, 0 18px 60px rgba(0, 0, 0, 0.9),
                0 0 90px rgba(60, 90, 200, 0.10);
  }
  /* the game already grades and vignettes its own frame; this is only the
     faint glass in front of it */
  #glass {
    position: absolute; inset: 2px;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0.16) 0 1px, rgba(0,0,0,0) 1px 3px);
    opacity: 0.25;
  }

  /* --- click-to-focus veil ------------------------------------------------ */
  #veil {
    position: absolute; inset: 2px;
    display: grid; place-items: center;
    background: rgba(5, 6, 12, 0.90);
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  #veil.gone { display: none; }
  #veil .panel {
    border: 1px solid var(--bevel);
    border-left: 3px solid var(--gold);
    background: linear-gradient(180deg, #131c36 0%, #0b1226 100%);
    padding: 18px 26px;
    max-width: 34ch;
  }
  #veil .go {
    font-family: Silkscreen, monospace;
    font-size: 15px; color: var(--gold);
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }
  #veil .why {
    margin: 0;
    font-size: 11.5px; line-height: 1.55; color: var(--dim);
  }

  /* --- control rail ------------------------------------------------------- */
  #rail {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 6px 14px;
    font-size: 11px; color: var(--dim);
  }
  .bind { display: flex; align-items: center; gap: 6px; }
  .bind .keys { display: flex; gap: 3px; }
  kbd {
    font-family: "DM Mono", monospace;
    font-size: 10px; font-weight: 500;
    color: var(--ice);
    background: var(--cap);
    border: 1px solid var(--bevel);
    border-bottom: 2px solid #070c18;
    border-radius: 3px;
    padding: 2px 5px;
    min-width: 18px; text-align: center;
    line-height: 1.2;
  }
  .bind .what { letter-spacing: 0.09em; text-transform: uppercase; }
  #rail .sep { color: var(--rule); }
  #full {
    font: inherit; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--bevel);
    border-radius: 3px;
    padding: 4px 9px;
    cursor: pointer;
  }
  #full:hover, #full:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }

  /* --- touch pad (phones and tablets only) -------------------------------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.visible { display: block; }
  #touch .btn {
    position: absolute; pointer-events: auto;
    display: grid; place-items: center;
    background: rgba(28, 36, 64, 0.62);
    border: 2px solid rgba(160, 190, 255, 0.3);
    border-radius: 10px;
    color: var(--ice);
    font-family: "DM Mono", monospace;
    font-size: 15px; font-weight: 500;
  }
  #touch .btn.on { background: rgba(248, 208, 72, 0.35); border-color: var(--gold); }
  #touch .dpad { position: absolute; left: 14px; bottom: 18px; width: 140px; height: 140px; }
  #touch .dpad .btn { width: 46px; height: 46px; }
  #touch [data-btn="up"]      { left: 47px; top: 0; }
  #touch [data-btn="down"]    { left: 47px; top: 94px; }
  #touch [data-btn="left"]    { left: 0; top: 47px; }
  #touch [data-btn="right"]   { left: 94px; top: 47px; }
  #touch [data-btn="confirm"] { right: 16px; bottom: 66px; width: 56px; height: 56px; }
  #touch [data-btn="cancel"]  { right: 82px; bottom: 20px; width: 50px; height: 50px; }
  #touch [data-btn="menu"]    { right: 16px; top: 14px; width: 56px; height: 34px; font-size: 11px; }
  #touch [data-btn="shift"]   { right: 78px; top: 14px; width: 56px; height: 34px; font-size: 11px; }
  @media (pointer: coarse) { #rail .bind, #plate .sub { display: none; } }
  /* On a touch device in landscape the pad replaces the keyboard rail and
     the wordmark just eats vertical space, so both go away entirely and
     #cabinet reserves the pad's own top/bottom bands as padding — the same
     fix as index.html's #wrap, so a tap on menu text never also lands on a
     pad button sitting on top of it. */
  @media (pointer: coarse) and (orientation: landscape) { #plate, #rail { display: none; } }
  /* screen.js's resize() (reimplemented in the boot script below, since this
     file has no module system) picks one of two pad layouts the moment
     #touch gains .visible: SIDE mode leaves #touch unclassed and parks the
     pad in the left/right margins via inline styles it sets itself — usually
     there's room, since a landscape phone is normally wider than this 16:9
     canvas — letting the canvas keep its natural size. #touch.band is BAND
     mode, the fallback for a viewport with no side room: the pad's original
     top/bottom bands, reserved here as padding so the canvas can never
     render underneath a button. */
  body:has(#touch.visible.band) #cabinet { padding: 58px 12px 170px; }

  /* The world is 480x270 — landscape. On a touch device held portrait the
     canvas shrinks to a thin centred strip with the on-screen pad's corner
     anchors far from it, since that pad is tuned for a canvas that fills
     most of the screen. Asking for landscape is simpler and more robust
     than reworking the pad's layout math for every possible aspect ratio. */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: var(--void); color: var(--ice);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  #rotate .glyph { font-size: 40px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .glyph { animation: none; } }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate { display: flex; }
    #cabinet, #touch { display: none !important; }
  }
</style>

<div id="cabinet">
  <div id="plate">
    <span class="mark">QUEST OF THE THIRTEEN</span>
    <span class="sub">save is kept in this browser</span>
  </div>

  <div id="stage" tabindex="0">
    <canvas id="screen" width="480" height="270"></canvas>
    <div id="glass"></div>
    <div id="veil">
      <div class="panel">
        <p class="go">CLICK TO PLAY</p>
        <p class="why">The game reads the keyboard, so it needs focus first. Click anywhere on the screen.</p>
      </div>
    </div>
  </div>

  <div id="rail">
    <span class="bind"><span class="keys"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></span><span class="what">move</span></span>
    <span class="bind"><span class="keys"><kbd>Z</kbd></span><span class="what">confirm</span></span>
    <span class="bind"><span class="keys"><kbd>X</kbd></span><span class="what">back</span></span>
    <span class="bind"><span class="keys"><kbd>C</kbd></span><span class="what">party</span></span>
    <span class="bind"><span class="keys"><kbd>Shift</kbd></span><span class="what">random / auto</span></span>
    <button id="full" type="button" hidden>Fullscreen</button>
  </div>
</div>

<div id="touch">
  <div class="dpad">
    <div class="btn" data-btn="up">&#9650;</div>
    <div class="btn" data-btn="down">&#9660;</div>
    <div class="btn" data-btn="left">&#9664;</div>
    <div class="btn" data-btn="right">&#9654;</div>
  </div>
  <div class="btn" data-btn="confirm">Z</div>
  <div class="btn" data-btn="cancel">X</div>
  <div class="btn" data-btn="menu">MENU</div>
  <div class="btn" data-btn="shift">SHIFT</div>
</div>

<div id="rotate">
  <div class="glyph">📱</div>
  <div>Turn your device sideways</div>
  <div style="opacity:.6; font-size:12px;">This game plays in landscape.</div>
</div>

<script>
(function () {
  const W = 480, H = 270;
  const stage  = document.getElementById('stage');
  const veil   = document.getElementById('veil');
  const rail   = document.getElementById('rail');
  const plate  = document.getElementById('plate');
  const canvas = document.getElementById('screen');
  const app    = window.app;

  // Two ways to give the touch pad room of its own, clear of the canvas:
  // SIDE mode parks it in the left/right margins (a landscape phone is
  // usually wider than this 16:9 canvas, so those margins usually exist and
  // are usually roomier than fixed top/bottom bands would be); BAND mode is
  // the fallback for a viewport with no side room. See src/engine/screen.js
  // for the canonical version of this — duplicated here because this file
  // has no module system to share it from.
  const DPAD_SIZE = 140, SIDE_BTN_W = 56, SIDE_MARGIN_GAP = 16, SIDE_STACK_GAP = 10;
  const SIDE_STACK = [
    { sel: '[data-btn="menu"]', w: 56, h: 34 },
    { sel: '[data-btn="shift"]', w: 56, h: 34 },
    { sel: '[data-btn="confirm"]', w: 56, h: 56 },
    { sel: '[data-btn="cancel"]', w: 50, h: 50 },
  ];
  const SIDE_STACK_H = SIDE_STACK.reduce((h, b) => h + b.h, 0) + SIDE_STACK_GAP * (SIDE_STACK.length - 1);

  function clearTouchSideLayout(touch) {
    const dpad = touch.querySelector('.dpad');
    if (dpad) { dpad.style.left = ''; dpad.style.top = ''; dpad.style.bottom = ''; }
    for (const { sel } of SIDE_STACK) {
      const el = touch.querySelector(sel);
      if (el) { el.style.left = ''; el.style.right = ''; el.style.top = ''; el.style.bottom = ''; }
    }
  }

  function applyTouchSideLayout(touch, sideMargin, canvasRight, viewportH) {
    const dpad = touch.querySelector('.dpad');
    if (dpad) {
      dpad.style.left = Math.round((sideMargin - DPAD_SIZE) / 2) + 'px';
      dpad.style.bottom = '';
      dpad.style.top = Math.round((viewportH - DPAD_SIZE) / 2) + 'px';
    }
    let y = Math.round((viewportH - SIDE_STACK_H) / 2);
    for (const { sel, w, h } of SIDE_STACK) {
      const el = touch.querySelector(sel);
      if (el) {
        el.style.left = Math.round(canvasRight + (sideMargin - w) / 2) + 'px';
        el.style.right = '';
        el.style.top = y + 'px';
        el.style.bottom = '';
      }
      y += h + SIDE_STACK_GAP;
    }
  }

  // The engine scales to the whole window. Here the game shares the page with
  // a wordmark and a control rail, so measure those and fit to what is left.
  if (app && app.screen) {
    const scr = app.screen;
    scr.resize = function () {
      const touch = document.getElementById('touch');
      const touchOn = touch?.classList.contains('visible') ?? false;
      const fit = (w, h) => {
        const raw = Math.min(w / W, h / H);
        return raw >= 1 ? Math.max(1, Math.floor(raw)) : Math.max(0.35, raw);
      };

      if (touchOn) {
        // plate/rail are display:none in touch+landscape (see the stylesheet),
        // so they contribute nothing here regardless of which mode is picked.
        const fullScale = fit(window.innerWidth - 28, window.innerHeight - 28);
        const sideMargin = (window.innerWidth - W * fullScale) / 2;
        const fitsSide = sideMargin >= DPAD_SIZE + SIDE_MARGIN_GAP
          && sideMargin >= SIDE_BTN_W + SIDE_MARGIN_GAP
          && window.innerHeight >= SIDE_STACK_H + SIDE_MARGIN_GAP;
        touch.classList.toggle('band', !fitsSide);
        if (fitsSide) {
          this.scale = fullScale;
          applyTouchSideLayout(touch, sideMargin, window.innerWidth - sideMargin, window.innerHeight);
        } else {
          this.scale = fit(window.innerWidth - 28, window.innerHeight - (58 + 170));
          clearTouchSideLayout(touch);
        }
      } else {
        // #cabinet's own flex gaps + default 12px+12px padding, approximated
        // — only relevant here since it's the one branch where they're real.
        const chrome = plate.offsetHeight + rail.offsetHeight + 68;
        this.scale = fit(window.innerWidth - 28, window.innerHeight - chrome);
      }
      canvas.width  = Math.round(W * this.scale);
      canvas.height = Math.round(H * this.scale);
      canvas.style.width  = Math.round(W * this.scale) + 'px';
      canvas.style.height = Math.round(H * this.scale) + 'px';
      this.out.imageSmoothingEnabled = false;
    };
    scr.resize();
    addEventListener('resize', () => scr.resize());
  }

  // Keyboard events only reach this frame once it has focus.
  const start = () => { veil.classList.add('gone'); stage.focus(); };
  veil.addEventListener('pointerdown', start);
  addEventListener('keydown', (e) => {
    if (!veil.classList.contains('gone')) start();
    // don't let the arrow keys scroll the page out from under the game
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
  }, { capture: true });
  if (matchMedia('(pointer: coarse)').matches) start();

  // Offer fullscreen only where this frame is actually allowed to enter it.
  const full = document.getElementById('full');
  if (document.fullscreenEnabled) {
    full.hidden = false;
    full.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => { full.hidden = true; });
    });
    document.addEventListener('fullscreenchange', () => {
      full.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      if (app && app.screen) app.screen.resize();
    });
  }
})();
</script>
