# Webmail for Piper, in front of Roundcube 1.7.
#
# Written by install-webmail.sh with __DOMAIN__ replaced. Certbot has already
# issued the certificate for this name, so the paths below are its paths — this
# file serves, it does not obtain.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Renewal keeps working: certbot's webroot challenge is answered here
    # rather than redirected away, which is how a redirect-everything rule
    # quietly breaks a certificate ninety days after somebody adds it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... ssl http2" rather than the "http2 on;" directive: that
    # directive arrived in nginx 1.25.1 and this box runs 1.24, where it is a
    # hard config error and nginx refuses to start at all.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # HSTS is safe here: this name serves nothing but webmail and already has a
    # certificate. X-Frame-Options is deliberately absent — Roundcube sets it
    # itself in PHP, and setting it twice is how you get a browser to ignore
    # both.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Roundcube 1.7 puts four entry points in public_html and everything else —
    # program/, skins/, plugins/, config/, vendor/ — outside it. Pointing the
    # document root here is what makes a request for /config/config.inc.php a
    # 404 rather than a copy of the IMAP password.
    root /var/www/roundcube/public_html;
    index index.php;

    # Reports arrive with photographs of a damaged console attached. This has
    # to agree with upload_max_filesize and post_max_size in the PHP pool, or
    # the upload dies against whichever limit is lower.
    client_max_body_size 25m;

    # No PHP anywhere outside the document root. This block comes first
    # deliberately: nginx takes the first matching regex location, and without
    # it the asset rule below would hand out plugins/piper_report/config.inc.php
    # as plain text — which is to say, hand out the Piper API token.
    location ~ ^/(program|skins|plugins)/.*\.(php|inc)$ {
        deny all;
        return 404;
    }

    # The assets themselves, served straight off disk from outside the
    # document root. Roundcube's own answer is to route them through
    # static.php, which works and means a PHP process for every icon.
    location ~ ^/(program|skins|plugins)/ {
        root /var/www/roundcube;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm-roundcube.sock;
        fastcgi_read_timeout 300;
    }

    # The installer writes configuration and is left behind by the tarball.
    # install-webmail.sh deletes it; this is the second lock on the same door.
    location ~ ^/installer {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
