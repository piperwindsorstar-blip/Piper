<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quest of the Thirteen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230e1640'/><path d='M7 2h2v9H7z' fill='%23f8d048'/><path d='M5 11h6v2H5z' fill='%23c8d8f8'/></svg>">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #05060c; overflow: hidden;
    font-family: ui-monospace, "Courier New", monospace; color: #c8d0e8;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; box-shadow: 0 0 0 2px #1c2440, 0 12px 48px rgba(0,0,0,.8);
  }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.visible { display: block; }
  #touch .btn {
    position: absolute; pointer-events: auto;
    display: grid; place-items: center;
    background: rgba(40,56,110,.5); border: 2px solid rgba(160,190,255,.35);
    border-radius: 10px; color: #dfe8ff; font-size: 15px; font-weight: 700;
  }
  #touch .btn.on { background: rgba(90,130,230,.7); }
  #touch .dpad .btn { width: 46px; height: 46px; }
  #touch .dpad { position: absolute; left: 14px; bottom: 18px; width: 140px; height: 140px; }
  #touch [data-btn="up"]    { left: 47px; top: 0; }
  #touch [data-btn="down"]  { left: 47px; top: 94px; }
  #touch [data-btn="left"]  { left: 0; top: 47px; }
  #touch [data-btn="right"] { left: 94px; top: 47px; }
  #touch [data-btn="confirm"] { right: 16px; bottom: 66px; width: 56px; height: 56px; }
  #touch [data-btn="cancel"]  { right: 82px; bottom: 20px; width: 50px; height: 50px; }
  #touch [data-btn="menu"]    { right: 16px; top: 14px; width: 56px; height: 34px; font-size: 12px; }
  #touch [data-btn="shift"]   { right: 78px; top: 14px; width: 56px; height: 34px; font-size: 12px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 11px; opacity: .45; }
  @media (pointer: coarse) { #hint { display: none; } }
  /* #touch's buttons live in a top band (0-58px) and a bottom band
     (0-170px, the dpad's own reach) measured from the viewport edges —
     never in the sides. Reserving exactly those bands as padding keeps the
     canvas from ever rendering underneath a button, so a tap on menu text
     never doubles as a tap on Cancel. screen.js's resize() sizes the canvas
     to match the moment #touch gains .visible. */
  body:has(#touch.visible) #wrap { padding: 58px 0 170px; }

  /* The world is 480x270 — landscape. On a touch device held portrait the
     canvas shrinks to a thin centred strip with the on-screen pad's corner
     anchors far from it, since that pad is tuned for a canvas that fills
     most of the screen. Asking for landscape is simpler and more robust
     than reworking the pad's layout math for every possible aspect ratio. */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: #05060c; color: #c8d0e8;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  #rotate .glyph { font-size: 40px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .glyph { animation: none; } }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate { display: flex; }
    #wrap, #touch, #hint { display: none !important; }
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen" width="256" height="224"></canvas></div>
  <div id="touch">
    <div class="dpad">
      <div class="btn" data-btn="up">▲</div>
      <div class="btn" data-btn="down">▼</div>
      <div class="btn" data-btn="left">◀</div>
      <div class="btn" data-btn="right">▶</div>
    </div>
    <div class="btn" data-btn="confirm">Z</div>
    <div class="btn" data-btn="cancel">X</div>
    <div class="btn" data-btn="menu">MENU</div>
    <div class="btn" data-btn="shift">SHIFT</div>
  </div>
  <div id="hint">arrows / WASD · Z confirm · X cancel · C or TAB menu</div>
  <div id="rotate">
    <div class="glyph">📱</div>
    <div>Turn your device sideways</div>
    <div style="opacity:.6; font-size:12px;">This game plays in landscape.</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
